server:
  port: 8080

spring:
  datasource:
    url: ${S1000D_DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${S1000D_DB_USER:s1000d_app}
    password: ${S1000D_DB_PASS:s1000d_secret}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

s1000d:
  storage:
    csdb-root: ./data/csdb
    published-root: ./data/published
    cache-root: ./data/cache
    audit-root: ./data/audit

viewer:
  indexer:
    index-on-startup: true
  render:
    published-preferred: true
    quick-preview-enabled: true
    cache-ttl-seconds: 3600
  applicability:
    unknown-policy: INCLUDE
    allowed-dimensions:
      - aircraft
      - engine
      - variant
    fragment-evaluation:
      enabled: false
  policy:
    enforcement:
      enabled: false
  security:
    jwt:
      secret: ${VIEWER_SECURITY_JWT_SECRET:dev-local-jwt-secret-change-in-production}
      expiration-seconds: ${VIEWER_SECURITY_JWT_EXPIRATION_SECONDS:28800}
    claim-mapping:
      roles-claim: ${VIEWER_SECURITY_ROLES_CLAIM:roles}
      username-claim: ${VIEWER_SECURITY_USERNAME_CLAIM:sub}
    oidc:
      enabled: ${VIEWER_SECURITY_OIDC_ENABLED:false}
      issuer-uri: ${VIEWER_SECURITY_OIDC_ISSUER_URI:}
      client-id: ${VIEWER_SECURITY_OIDC_CLIENT_ID:}
    cors:
      allowed-origins:
        - ${VIEWER_CORS_ORIGIN_1:http://localhost:5173}
        - ${VIEWER_CORS_ORIGIN_2:http://127.0.0.1:5173}
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      exposed-headers:
        - Authorization
    demo-users:
      - username: admin
        password: ${VIEWER_DEMO_ADMIN_PASSWORD:admin123}
        roles: [ROLE_ADMIN]
      - username: eng
        password: ${VIEWER_DEMO_ENGINEER_PASSWORD:eng123}
        roles: [ROLE_ENGINEER]
      - username: view
        password: ${VIEWER_DEMO_VIEWER_PASSWORD:view123}
        roles: [ROLE_VIEWER]
