server:
  port: 8080

spring:
  datasource:
    url: ${S1000D_DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${S1000D_DB_USER:s1000d_app}
    password: ${S1000D_DB_PASS:s1000d_secret}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

s1000d:
  storage:
    csdb-root: ${S1000D_CSDB_ROOT:../data/csdb}
    published-root: ${S1000D_PUBLISHED_ROOT:../data/published}
    cache-root: ${S1000D_CACHE_ROOT:../data/cache}
    audit-root: ${S1000D_AUDIT_ROOT:../data/audit}
  ldap:
    url: ${S1000D_LDAP_URL:ldap://localhost:389}
    base-dn: ${S1000D_LDAP_BASE_DN:dc=s1000d,dc=org}
    manager-dn: ${S1000D_LDAP_MANAGER_DN:cn=admin,dc=s1000d,dc=org}
    manager-password: ${S1000D_LDAP_MANAGER_PASS:admin}
    user-dn-pattern: ${S1000D_LDAP_USER_DN_PATTERN:uid={0},ou=people}
    group-search-base: ${S1000D_LDAP_GROUP_SEARCH_BASE:ou=groups}
    group-search-filter: ${S1000D_LDAP_GROUP_SEARCH_FILTER:(member={0})}
  opa:
    enabled: ${S1000D_OPA_ENABLED:true}
    url: ${S1000D_OPA_URL:http://localhost:8181}
    policy-path: ${S1000D_OPA_POLICY_PATH:/v1/data/s1000d/authz/allow}
    allow-read-on-error: ${S1000D_OPA_ALLOW_READ_ON_ERROR:false}

viewer:
  indexer:
    index-on-startup: true
  render:
    published-preferred: true
    quick-preview-enabled: true
    cache-ttl-seconds: 3600
  applicability:
    unknown-policy: INCLUDE
    allowed-dimensions:
      - aircraft
      - engine
      - variant
    fragment-evaluation:
      enabled: false
  policy:
    enforcement:
      enabled: false
  security:
    jwt:
      secret: ${VIEWER_SECURITY_JWT_SECRET:dev-local-jwt-secret-change-in-production}
      expiration-seconds: ${VIEWER_SECURITY_JWT_EXPIRATION_SECONDS:28800}
    claim-mapping:
      roles-claim: ${VIEWER_SECURITY_ROLES_CLAIM:roles}
      username-claim: ${VIEWER_SECURITY_USERNAME_CLAIM:sub}
    oidc:
      enabled: ${VIEWER_SECURITY_OIDC_ENABLED:false}
      issuer-uri: ${VIEWER_SECURITY_OIDC_ISSUER_URI:}
      client-id: ${VIEWER_SECURITY_OIDC_CLIENT_ID:}
    cors:
      allowed-origins:
        - ${VIEWER_CORS_ORIGIN_1:http://localhost:5173}
        - ${VIEWER_CORS_ORIGIN_2:http://127.0.0.1:5173}
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      exposed-headers:
        - Authorization
