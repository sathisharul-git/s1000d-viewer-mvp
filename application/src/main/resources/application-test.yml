spring:
  datasource:
    url: jdbc:h2:mem:s1000d_test;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

s1000d:
  storage:
    csdb-root: ./data/csdb
    published-root: ./data/published
    cache-root: ./data/cache
    audit-root: ./data/audit
  opa:
    enabled: false
