plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.s1000Dorg.viewer'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-ldap'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'net.sf.saxon:Saxon-HE:12.5'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
    runtimeOnly 'org.flywaydb:flyway-database-oracle'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}

tasks.register('stopServer') {
    group = 'application'
    description = 'Stops the backend process listening on port 8080 (override with -PserverPort=<port>).'

    doLast {
        String port = (project.findProperty('serverPort') ?: '8080').toString()
        boolean isWindows = System.getProperty('os.name').toLowerCase().contains('win')
        List<String> pids = []

        if (isWindows) {
            Process discover = new ProcessBuilder(
                'powershell',
                '-NoProfile',
                '-Command',
                "Get-NetTCPConnection -LocalPort ${port} -State Listen -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique"
            )
                .redirectErrorStream(true)
                .start()
            String output = discover.inputStream.getText('UTF-8')
            discover.waitFor()
            pids = output.readLines()
                .collect { it.trim() }
                .findAll { it ==~ /\d+/ }
        } else {
            Process discover = new ProcessBuilder('sh', '-c', "lsof -ti tcp:${port} || true")
                .redirectErrorStream(true)
                .start()
            String output = discover.inputStream.getText('UTF-8')
            discover.waitFor()
            pids = output.readLines()
                .collect { it.trim() }
                .findAll { it ==~ /\d+/ }
        }

        List<String> uniquePids = pids.unique()
        if (uniquePids.isEmpty()) {
            println "No server process is listening on port ${port}."
            return
        }

        uniquePids.each { pid ->
            Process killProc = isWindows
                ? new ProcessBuilder('taskkill', '/PID', pid, '/F').redirectErrorStream(true).start()
                : new ProcessBuilder('kill', '-9', pid).redirectErrorStream(true).start()
            String killOutput = killProc.inputStream.getText('UTF-8').trim()
            killProc.waitFor()
            if (!killOutput.isBlank()) {
                println killOutput
            }
        }

        println "Stopped process(es) on port ${port}: ${uniquePids.join(', ')}"
    }
}
